<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b101a"><title>Survival Arena · GMM Playtest</title><link rel="stylesheet" href="./style.css"></head>
<body><main id="app"><header><div class="brand"><span class="mark">G</span><span>GAME MAKING MACHINE <small>PLAYTEST / V1</small></span></div><button id="sound" class="icon" aria-label="Toggle sound">Sound off</button></header>
<section class="intro"><p id="eyebrow" class="eyebrow"></p><h1 id="title"></h1><p id="objective"></p></section>
<div id="stats" class="stats" aria-label="Game status"></div>
<section class="stage"><canvas id="board" width="640" height="640" aria-label="Game board"></canvas><div id="overlay" class="overlay"><div class="overlay-card"><p class="eyebrow" id="overlay-tag">READY WHEN YOU ARE</p><h2 id="overlay-title"></h2><p id="overlay-text"></p><button id="play" class="primary">Start playing</button></div></div></section>
<p id="message" role="status" aria-live="polite"></p><div id="controls" class="controls"></div><section id="actions" class="actions"></section>
<footer><button id="pause">Pause</button><button id="restart">New run</button><button id="export">Export review</button><span id="save-status">Saves on this device</span></footer><p class="footnote" id="identity"></p>
<dialog id="review"><h2>Your playtest</h2><p>A recording shows what happened. Your notes explain how it felt.</p><label>Enjoyment <select id="rating"><option value="">Not rated</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select> / 5</label><label>Where were you bored, confused or stuck?<textarea id="notes" rows="4" maxlength="4000"></textarea></label><p class="footnote">Downloads a small JSON file with your notes, build ID and recent actions. Nothing is sent automatically.</p><div class="actions"><button id="download" class="primary">Download review</button><button id="close-review">Close</button></div></dialog>
</main><script type="module" src="./runtime.js?v=c82b090b1f9973cec602c04f7f75fcc17d4e4b8e305b9b4759ca9db7129378bc"></script></body></html>
